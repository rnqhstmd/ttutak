name: Auto Release on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify manifest parity and changelog
        id: version
        run: |
          set -euo pipefail
          PN=$(jq -er '.name | select(type == "string" and length > 0)' .claude-plugin/plugin.json)
          PV=$(jq -er '.version' .claude-plugin/plugin.json)
          if ! [[ "$PV" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::invalid manifest SemVer'
            exit 1
          fi
          jq -e --arg name "$PN" --arg version "$PV" '[.plugins[]? | select(.name == $name)] | length == 1 and .[0].version == $version' .claude-plugin/marketplace.json >/dev/null
          jq -e --arg name "$PN" --arg version "$PV" '.name == $name and .version == $version' .codex-plugin/plugin.json >/dev/null
          VERSION_RE=${PV//./\\.}
          if ! grep -Eq "^## v${VERSION_RE}([ (]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing exact version section"
            exit 1
          fi
          echo "version=$PV" >> "$GITHUB_OUTPUT"
          echo "tag=v$PV" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog for this version
        if: steps.check_tag.outputs.exists == 'false'
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION_RE=${VERSION//./\\.}
          HEADER=$(grep -E "^## v${VERSION_RE}([ (]|$)" CHANGELOG.md | head -1)
          TITLE_DESC=$(printf '%s\n' "$HEADER" | sed -n 's/.*— \(.*\)/\1/p')
          if [ -n "$TITLE_DESC" ]; then
            echo "title=v${VERSION} — ${TITLE_DESC}" >> "$GITHUB_OUTPUT"
          else
            echo "title=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi
          awk -v pattern="^## v${VERSION_RE}([ (]|$)" '$0 ~ pattern {flag=1; next} /^## v[0-9]/{flag=0} flag' CHANGELOG.md > "$RUNNER_TEMP/release_body.md"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TITLE: ${{ steps.changelog.outputs.title }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/release_body.md"
